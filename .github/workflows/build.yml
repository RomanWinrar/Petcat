name: Build PSP

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: pspdev/pspdev:latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: make
      - name: Package
        run: |
          mkdir -p out/PSP/GAME/PetCat
          cp EBOOT.PBP out/PSP/GAME/PetCat/
      - uses: actions/upload-artifact@v4
        with:
          name: PetCat-PSP
          path: out
